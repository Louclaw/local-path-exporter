# Example DaemonSet for a GitOps repo. One pod per node, no hostNetwork.
# Only /var/lib/rancher/k3s/storage is mounted, read-only.
# XFS project quotas are not read; usage may exceed the PVC request.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: local-path-exporter
  namespace: kube-system
  labels:
    app.kubernetes.io/name: local-path-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: local-path-exporter
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-path-exporter
    spec:
      serviceAccountName: local-path-exporter
      automountServiceAccountToken: true
      hostNetwork: false
      hostPID: false
      hostIPC: false
      tolerations:
        - operator: Exists
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # Pin a release tag or digest. Do not track the moving :main tag.
          image: ghcr.io/louclaw/local-path-exporter:v0.1.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9100
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: STORAGE_PATH
              value: /var/lib/rancher/k3s/storage
            - name: METRICS_ADDR
              value: ":9100"
            - name: SCAN_INTERVAL
              value: 5m
            - name: SCAN_TIMEOUT
              value: 2m
            - name: SCAN_PARALLELISM
              value: "1"
            # Each 50000 tracked entries adds one SCAN_INTERVAL, capped
            # by the full-scan period. The memory limit stays 128Mi.
            - name: SCAN_ENTRIES_PER_STEP
              value: "50000"
            # Allowed range is 6h to 24h. In-place rewrites wait for this.
            - name: FULL_SCAN_INTERVAL
              value: 6h
            - name: SCAN_CACHE_MAX_BYTES
              value: "8388608"
            # Bounds the Go heap only. memory.reclaim is often EROFS in the pod.
            - name: GOMEMLIMIT
              value: "100MiB"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop: ["ALL"]
              add: ["DAC_READ_SEARCH"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: storage
              mountPath: /var/lib/rancher/k3s/storage
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
      volumes:
        - name: storage
          hostPath:
            path: /var/lib/rancher/k3s/storage
            type: Directory
