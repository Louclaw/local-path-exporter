apiVersion: v1
kind: Service
metadata:
  name: local-path-exporter
  namespace: kube-system
  labels:
    app.kubernetes.io/name: local-path-exporter
    prometheus-job: local-path-exporter
spec:
  selector:
    app.kubernetes.io/name: local-path-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
