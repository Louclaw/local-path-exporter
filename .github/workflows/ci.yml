name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -o /dev/null ./cmd/local-path-exporter

  image:
    name: image
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: local-path-exporter:ci
          labels: |
            org.opencontainers.image.source=https://github.com/Louclaw/local-path-exporter

  publish:
    name: publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          set -euo pipefail
          image=ghcr.io/louclaw/local-path-exporter
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tags=${image}:${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            {
              echo "tags<<EOF"
              echo "${image}:main"
              echo "${image}:sha-${GITHUB_SHA::12}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/Louclaw/local-path-exporter
