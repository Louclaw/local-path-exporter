name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -o /dev/null ./cmd/local-path-exporter

  image:
    name: image
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: local-path-exporter:ci
          labels: |
            org.opencontainers.image.source=https://github.com/Louclaw/local-path-exporter
      - name: Smoke
        run: |
          set -euo pipefail
          sa="$(mktemp -d)"
          chmod 755 "${sa}"
          printf 'smoke' > "${sa}/token"
          printf 'smoke' > "${sa}/ca.crt"
          printf 'default' > "${sa}/namespace"
          chmod 644 "${sa}/token" "${sa}/ca.crt" "${sa}/namespace"
          docker rm -f lpe-smoke >/dev/null 2>&1 || true
          docker run -d --name lpe-smoke \
            -e NODE_NAME=smoke \
            -e KUBERNETES_SERVICE_HOST=127.0.0.1 \
            -e KUBERNETES_SERVICE_PORT=1 \
            -v "${sa}:/var/run/secrets/kubernetes.io/serviceaccount:ro" \
            -p 9100:9100 \
            local-path-exporter:ci
          cleanup() { docker logs lpe-smoke >&2 || true; docker rm -f lpe-smoke >/dev/null || true; }
          trap cleanup EXIT
          ok=0
          for _ in $(seq 1 50); do
            if curl -sf http://127.0.0.1:9100/healthz >/dev/null; then
              ok=1
              break
            fi
            sleep 0.2
          done
          if [[ "${ok}" != 1 ]]; then
            echo "healthz did not respond" >&2
            exit 1
          fi
          curl -sf http://127.0.0.1:9100/metrics | grep -q local_path_exporter_scan_errors_total
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9100/readyz)"
          test "${code}" = "503"
          test "$(docker inspect -f '{{.State.Running}}' lpe-smoke)" = "true"

  publish:
    name: publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/louclaw/local-path-exporter
          flavor: |
            latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
